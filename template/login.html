<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AI Poetry Generator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>


    <div class="auth-container">

        <div class="auth-card">

            <div class="auth-logo">
                ✨
            </div>

            <h1>
                Welcome Back
            </h1>

            <p class="subtitle">

                Login to your AI Poetry Generator account.

            </p>


            <!-- Flash Messages -->

            {% with messages = get_flashed_messages() %}

                {% if messages %}

                    <div class="flash-message">

                        {% for message in messages %}

                            <p>{{ message }}</p>

                        {% endfor %}

                    </div>

                {% endif %}

            {% endwith %}


            <!-- Login Form -->

            <form method="POST"
                  action="{{ url_for('login') }}">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button type="submit"
                        class="btn primary-btn">

                    Login

                </button>

            </form>


            <p class="auth-link">

                Don't have an account?

                <a href="{{ url_for('register') }}">

                    Create Account

                </a>

            </p>


            <p class="auth-link">

                <a href="{{ url_for('index') }}">

                    ← Back to Home

                </a>

            </p>

        </div>

    </div>


</body>

</html>
