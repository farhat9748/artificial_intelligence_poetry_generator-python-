<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Poem - AI Poetry Generator</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #f3e8ff,
                #e0e7ff
            );

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

        }

        .delete-container {

            background: white;

            width: 90%;

            max-width: 450px;

            padding: 40px;

            border-radius: 16px;

            text-align: center;

            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);

        }

        .delete-icon {

            font-size: 60px;

            margin-bottom: 20px;

        }

        h1 {

            color: #dc2626;

            margin-bottom: 15px;

        }

        p {

            color: #555;

            line-height: 1.6;

            margin-bottom: 25px;

        }

        .poem-title {

            background: #f3f4f6;

            padding: 15px;

            border-radius: 8px;

            margin-bottom: 25px;

            font-weight: bold;

            color: #333;

        }

        .buttons {

            display: flex;

            justify-content: center;

            gap: 12px;

            flex-wrap: wrap;

        }

        button,
        .cancel-btn {

            padding: 12px 22px;

            border: none;

            border-radius: 8px;

            font-size: 15px;

            cursor: pointer;

            text-decoration: none;

        }

        .delete-btn {

            background: #dc2626;

            color: white;

        }

        .delete-btn:hover {

            background: #b91c1c;

        }

        .cancel-btn {

            background: #e5e7eb;

            color: #333;

        }

        .cancel-btn:hover {

            background: #d1d5db;

        }

    </style>

</head>

<body>


    <div class="delete-container">

        <div class="delete-icon">
            🗑️
        </div>

        <h1>
            Delete Poem?
        </h1>

        <p>

            Are you sure you want to delete this poem?

            This action cannot be undone.

        </p>


        <div class="poem-title">

            {{ poem.topic }}

        </div>


        <div class="buttons">

            <form
                action="{{ url_for('delete_poem', poem_id=poem.id) }}"
                method="POST">

                <button type="submit"
                        class="delete-btn">

                    Yes, Delete

                </button>

            </form>


            <a href="{{ url_for('poems') }}"
               class="cancel-btn">

                Cancel

            </a>

        </div>

    </div>


</body>

</html>
