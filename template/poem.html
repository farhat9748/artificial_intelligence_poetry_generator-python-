<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Generate Poem - AI Poetry Generator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav>

        <h2>✨ AI Poetry Generator</h2>

        <div>

            <a href="{{ url_for('index') }}">Home</a>

            <a href="{{ url_for('dashboard') }}">Dashboard</a>

            <a href="{{ url_for('poems') }}">Saved Poems</a>

            <a href="{{ url_for('login') }}">Login</a>

        </div>

    </nav>


    <main class="container">

        <h1>Create Your Own Poem</h1>

        <p class="subtitle">

            Enter a topic, select a mood and poetry style.

        </p>


        <form method="POST"
              action="{{ url_for('generate_poem') }}">

            <div class="form-group">

                <label for="topic">

                    Enter a topic

                </label>

                <input
                    type="text"
                    id="topic"
                    name="topic"
                    placeholder="Nature, Love, Friendship..."
                    required
                >

            </div>


            <div class="form-group">

                <label for="mood">

                    Select Mood

                </label>

                <select id="mood" name="mood" required>

                    <option value="romantic">Romantic</option>

                    <option value="sad">Sad</option>

                    <option value="nature">Nature</option>

                    <option value="motivational">Motivational</option>

                </select>

            </div>


            <div class="form-group">

                <label for="style">

                    Select Poetry Style

                </label>

                <select id="style" name="style" required>

                    <option value="Free Verse">Free Verse</option>

                    <option value="Sonnet">Sonnet</option>

                    <option value="Haiku">Haiku</option>

                    <option value="Limerick">Limerick</option>

                    <option value="Ballad">Ballad</option>

                    <option value="Ode">Ode</option>

                    <option value="Acrostic">Acrostic</option>

                </select>

            </div>


            <button type="submit">

                ✨ Generate Poem

            </button>

        </form>

    </main>


    <footer>

        <p>© 2026 AI Poetry Generator</p>

    </footer>

</body>

</html>
